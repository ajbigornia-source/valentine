<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    body {
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
    }
    h1 {
      color: #ff4d6d;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.2s ease;
    }
    #yesBtn {
      background: #ff4d6d;
      color: white;
    }
    #noBtn {
      background: #999;
      color: white;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 Will you be my Valentime? 💖</h1>
    <h3>Galing ‘to sa’kin, pinag-isipan ko ‘to ha 😌</h3>
    <p id="message">Mamili ka nang mabuti…</p>
    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 💔</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const message = document.getElementById('message');

    const noMessages = [
      "Oh bat no? 😢",
      "Think again... last mo na yan haha",
      "Last chance! 😭",
      "Wow ayaw pa mag yes, pakipot. 📸",
      "Edi wow 💔"
    ];

    let noCount = 0;

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
      message.textContent = noMessages[noCount % noMessages.length];
      noCount++;
    });

    yesBtn.addEventListener('click', () => {
      document.querySelector('.card').innerHTML = `
        <h1>🎉 YAY!!! 🎉</h1>
        <p>Dahil dyan libre mo ko sa 14 💕</p>
        <p>See you on 14, pa-check up ka muna sa umaga haha 😘</p>
        <img src="https://scontent.fmnl17-6.fna.fbcdn.net/v/t39.30808-6/471949751_27861659596814162_7184683926434902913_n.jpg?_nc_cat=100&ccb=1-7&_nc_sid=127cfc&_nc_eui2=AeH0f1VZdEY-Ykmds7aO5u8c6tuPmKF0IgTq24-YoXQiBNfQdl5pf6-RPJwzfYSXLWCWUGPM3Msvjm6x56oErKSP&_nc_ohc=RL-EUBsLEhoQ7kNvwGkXJSs&_nc_oc=AdnrkjY2LQ1n5ol7nq2ZzGWsOwxXClcaCXWc9AYtKXT0viTHJ64PM690mWuNaPXdSmY&_nc_zt=23&_nc_ht=scontent.fmnl17-6.fna&_nc_gid=wIl35RJ_SekdQSxOTeWqRA&oh=00_Afux0mQienA0R7XOzixsKk-5G68cL5Ga3BLrZ4TD08SZwQ&oe=698FA8A4" width="200">
      `;
    });
  </script>
</body>
</html>
